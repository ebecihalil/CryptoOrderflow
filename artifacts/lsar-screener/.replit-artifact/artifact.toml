kind = "web"
previewPath = "/"
title = "Perpetual LSAR Screener"
description = "A live screener for Binance and Bybit perpetual futures that ranks long/short account-ratio changes by timeframe and combines shared markets using open-interest weights."
version = "1.0.0"
id = "artifacts/lsar-screener"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23073

[services.development]
run = "pnpm --filter @workspace/lsar-screener run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lsar-screener", "run", "build" ]
serve = "static"
publicDir = "artifacts/lsar-screener/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23073"
BASE_PATH = "/"
