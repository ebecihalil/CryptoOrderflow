openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market
    description: Live perpetual futures positioning data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market/lsar:
    get:
      operationId: getLsarMarketSnapshot
      tags: [market]
      summary: Get the latest cross-exchange LSAR screener snapshot
      description: Returns all supported perpetual markets, current prices, OI-weighted long-short account ratios, and ratio changes across supported windows.
      responses:
        "200":
          description: Current cached market snapshot, including partial data during refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LsarMarketSnapshot"
  /market/summary:
    get:
      operationId: getLsarMarketSummary
      tags: [market]
      summary: Get market coverage and the largest ratio changes
      parameters:
        - name: timeframe
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LsarTimeframe"
      responses:
        "200":
          description: Market counts and strongest LSAR moves for the requested window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LsarMarketSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LsarTimeframe:
      type: string
      enum: [5m, 15m, 30m, 1h, 4h, 24h]
    MarketExchange:
      type: string
      enum: [binance, bybit]
    MarketSourceStatus:
      type: object
      properties:
        exchange:
          $ref: "#/components/schemas/MarketExchange"
        status:
          type: string
          enum: [connecting, refreshing, live, delayed, error]
        marketCount:
          type: integer
        updatedAt:
          type: [string, "null"]
          format: date-time
        error:
          type: [string, "null"]
      required: [exchange, status, marketCount, updatedAt, error]
    LsarChange:
      type: object
      properties:
        timeframe:
          $ref: "#/components/schemas/LsarTimeframe"
        ratioChangePct:
          type: [number, "null"]
          description: Relative percentage change in the long-short account ratio.
        longShareChangePp:
          type: [number, "null"]
          description: Absolute change in long-account share, measured in percentage points.
        currentRatio:
          type: [number, "null"]
        previousRatio:
          type: [number, "null"]
        currentLongSharePct:
          type: [number, "null"]
        previousLongSharePct:
          type: [number, "null"]
        currentTimestamp:
          type: [string, "null"]
          format: date-time
        previousTimestamp:
          type: [string, "null"]
          format: date-time
        sourceCount:
          type: integer
      required:
        - timeframe
        - ratioChangePct
        - longShareChangePp
        - currentRatio
        - previousRatio
        - currentLongSharePct
        - previousLongSharePct
        - currentTimestamp
        - previousTimestamp
        - sourceCount
    LsarExchangeReading:
      type: object
      properties:
        exchange:
          $ref: "#/components/schemas/MarketExchange"
        symbol:
          type: string
        price:
          type: number
        openInterestUsd:
          type: number
        longShortRatio:
          type: [number, "null"]
        longSharePct:
          type: [number, "null"]
        updatedAt:
          type: [string, "null"]
          format: date-time
      required: [exchange, symbol, price, openInterestUsd, longShortRatio, longSharePct, updatedAt]
    LsarInstrument:
      type: object
      properties:
        asset:
          type: string
        price:
          type: number
        priceChange24hPct:
          type: [number, "null"]
        openInterestUsd:
          type: number
        exchanges:
          type: array
          items:
            $ref: "#/components/schemas/MarketExchange"
        currentRatio:
          type: [number, "null"]
        longSharePct:
          type: [number, "null"]
        changes:
          type: array
          items:
            $ref: "#/components/schemas/LsarChange"
        exchangeReadings:
          type: array
          items:
            $ref: "#/components/schemas/LsarExchangeReading"
      required:
        - asset
        - price
        - priceChange24hPct
        - openInterestUsd
        - exchanges
        - currentRatio
        - longSharePct
        - changes
        - exchangeReadings
    LsarMarketSnapshot:
      type: object
      properties:
        generatedAt:
          type: [string, "null"]
          format: date-time
        isRefreshing:
          type: boolean
        totalMarkets:
          type: integer
        coverage:
          type: object
          properties:
            binance:
              type: integer
            bybit:
              type: integer
            both:
              type: integer
            binanceOnly:
              type: integer
            bybitOnly:
              type: integer
          required: [binance, bybit, both, binanceOnly, bybitOnly]
        sources:
          type: array
          items:
            $ref: "#/components/schemas/MarketSourceStatus"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/LsarInstrument"
      required: [generatedAt, isRefreshing, totalMarkets, coverage, sources, rows]
    LsarMarketSummary:
      type: object
      properties:
        timeframe:
          $ref: "#/components/schemas/LsarTimeframe"
        generatedAt:
          type: [string, "null"]
          format: date-time
        isRefreshing:
          type: boolean
        totalMarkets:
          type: integer
        dualListed:
          type: integer
        binanceOnly:
          type: integer
        bybitOnly:
          type: integer
        strongestIncrease:
          type: ["object", "null"]
          properties:
            asset:
              type: string
            ratioChangePct:
              type: number
          required: [asset, ratioChangePct]
        strongestDecrease:
          type: ["object", "null"]
          properties:
            asset:
              type: string
            ratioChangePct:
              type: number
          required: [asset, ratioChangePct]
      required:
        - timeframe
        - generatedAt
        - isRefreshing
        - totalMarkets
        - dualListed
        - binanceOnly
        - bybitOnly
        - strongestIncrease
        - strongestDecrease

